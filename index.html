<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger — Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>

</head>
<body>

  <div class="ledger">

    <header class="ledger__header">
      <p class="ledger__eyebrow">Today's Ledger</p>
      <h1 class="ledger__title">To-Do</h1>
      <p class="ledger__count"><span>4</span> items &middot; <span>1</span> done</p>
    </header>

    <form id="add-task-form" class="add-row" action="#">
      <label for="new-task" class="visually-hidden">Add a new task</label>
      <input type="text" id="new-task" class="add-row__input" placeholder="Write a new task…" aria-label="New task">
      <button type="submit" class="add-row__btn">Add</button>
    </form>
    <p id="error-message"></p>

    <ul id="task-list">
      
    </ul>

  </div>

</body>
</html>
